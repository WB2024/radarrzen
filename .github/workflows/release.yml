name: Build and Release WGT

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tizen Studio CLI (headless)
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.0-37 libglu1-mesa libpng16-16 libjpeg-turbo8 zip pciutils gettext-base default-jre || true
          wget -q https://download.tizen.org/sdk/Installer/tizen-studio_6.0/web-cli_Tizen_Studio_6.0_ubuntu-64.bin -O installer.bin
          chmod +x installer.bin
          ./installer.bin --accept-license "$HOME/tizen-studio"
          echo "$HOME/tizen-studio/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$HOME/tizen-studio/tools" >> "$GITHUB_PATH"

      - name: Create cert and package WGT
        run: |
          set -e
          sudo apt-get install -y gnome-keyring dbus-x11 -qq 2>/dev/null || true

          # Write helper script - runs under a single D-Bus session so keyring persists
          cat > /tmp/tizen_sign.sh << 'SCRIPT'
          set -e
          printf '' | gnome-keyring-daemon --unlock --start --components=secrets 2>/dev/null || true

          tizen certificate -a "Radarrzen" -p "cipass1234" -c GB -o "Radarrzen" 2>&1 || true
          AUTHOR_P12=$(find "$HOME/tizen-studio-data/keystore/author" -name "*.p12" 2>/dev/null | head -1)
          [[ -z "$AUTHOR_P12" ]] && { echo "::error::Author cert not generated"; exit 1; }
          echo "Author p12: $AUTHOR_P12"

          tizen security-profiles add -n RadarrzenProfile -a "$AUTHOR_P12" -p "cipass1234"
          echo "=== profiles.xml ==="
          cat "$HOME/tizen-studio-data/profile/profiles.xml"
          tizen cli-config "profiles.path=$HOME/tizen-studio-data/profile/profiles.xml"

          tizen package --type wgt --sign RadarrzenProfile -- src/ || {
            echo "=== tizen package FAILED ==="
            cat "$HOME/tizen-studio-data/cli/logs/cli.log" 2>/dev/null
            exit 1
          }
          SCRIPT
          chmod +x /tmp/tizen_sign.sh
          dbus-run-session -- bash /tmp/tizen_sign.sh

          WGT=$(ls src/*.wgt | head -1)
          mv "$WGT" Radarrzen.wgt
          ls -la Radarrzen.wgt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Radarrzen.wgt
          generate_release_notes: true

      - name: Upload artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Radarrzen-wgt
          path: Radarrzen.wgt
