name: Build and Release WGT

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tizen Studio CLI (headless)
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.0-37 libglu1-mesa libpng16-16 libjpeg-turbo8 zip pciutils gettext-base default-jre || true
          wget -q https://download.tizen.org/sdk/Installer/tizen-studio_6.0/web-cli_Tizen_Studio_6.0_ubuntu-64.bin -O installer.bin
          chmod +x installer.bin
          ./installer.bin --accept-license "$HOME/tizen-studio"
          echo "$HOME/tizen-studio/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$HOME/tizen-studio/tools" >> "$GITHUB_PATH"

      - name: Import signing certificate
        env:
          TIZEN_CERT_P12:  ${{ secrets.TIZEN_CERT_P12 }}
          TIZEN_CERT_PASS: ${{ secrets.TIZEN_CERT_PASS }}
        run: |
          set -e
          if [[ -z "$TIZEN_CERT_P12" || -z "$TIZEN_CERT_PASS" ]]; then
            echo "::error::TIZEN_CERT_P12 and TIZEN_CERT_PASS secrets must be set"
            exit 1
          fi
          echo "$TIZEN_CERT_P12" | base64 -d > /tmp/radarrzen.p12
          tizen security-profiles add \
            -n RadarrzenProfile \
            -a /tmp/radarrzen.p12 \
            -p "$TIZEN_CERT_PASS"
          tizen cli-config "profiles.path=$HOME/tizen-studio-data/profile/profiles.xml"

      - name: Package WGT
        run: |
          tizen package --type wgt --sign RadarrzenProfile -- src/ || {
            echo "=== Tizen CLI log ===" && cat "$HOME/tizen-studio-data/cli/logs/cli.log" | tail -50
            exit 1
          }
          WGT=$(ls src/*.wgt | head -1)
          mv "$WGT" Radarrzen.wgt
          ls -la Radarrzen.wgt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Radarrzen.wgt
          generate_release_notes: true

      - name: Upload artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Radarrzen-wgt
          path: Radarrzen.wgt
